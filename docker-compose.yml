version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: resume_screener_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_screener_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_screener_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./resume-screener-backend
      dockerfile: Dockerfile
    container_name: resume_screener_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resume_screener_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      AI_PROVIDER: ${AI_PROVIDER:-GROQ}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_screener_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

